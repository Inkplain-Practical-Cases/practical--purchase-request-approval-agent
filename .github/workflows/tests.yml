name: Validate all seven learning branches
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    name: pytest on ${{ matrix.branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        branch:
          - step-01-receive-purchase-requests
          - step-02-evaluate-business-rules
          - step-03-implement-workflow-state
          - step-04-add-human-approval
          - step-05-resume-suspended-workflows
          - step-06-harden-and-verify
          - main
    steps:
      - name: Checkout selected learning branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - name: Configure Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies for this branch
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit and real HTTP integration tests
        env:
          AUTO_APPROVAL_LIMIT_EUR: "500.00"
          DEMO_MANAGER_TOKEN: "local-demo-manager-token"
        run: python -m pytest -q
